<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DUSUCO - Vitrine de Promoções na TV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #060913;
            --bg-surface: rgba(15, 23, 42, 0.75);
            --border: rgba(255, 255, 255, 0.1);
            --primary: #FF5500;
            --primary-glow: rgba(255, 85, 0, 0.45);
            --accent-gold: #FBBF24;
            --accent-gold-glow: rgba(251, 191, 36, 0.4);
            --green: #10B981;
            --text-main: #FFFFFF;
            --text-muted: #94A3B8;
            --font-display: 'Outfit', sans-serif;
            --font-body: 'Inter', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: var(--font-body);
        }

        /* Ambient Lighting Background */
        .ambient-glow {
            position: fixed;
            top: -20%;
            left: -10%;
            width: 70vw;
            height: 70vh;
            background: radial-gradient(circle, rgba(234, 88, 12, 0.25) 0%, rgba(6, 9, 19, 0) 70%);
            filter: blur(80px);
            z-index: 0;
            pointer-events: none;
            transition: all 1.5s ease;
        }

        .ambient-glow-2 {
            position: fixed;
            bottom: -20%;
            right: -10%;
            width: 60vw;
            height: 60vh;
            background: radial-gradient(circle, rgba(251, 191, 36, 0.18) 0%, rgba(6, 9, 19, 0) 70%);
            filter: blur(90px);
            z-index: 0;
            pointer-events: none;
        }

        .tv-container {
            position: relative;
            z-index: 1;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 2.5vh 3.5vw 2vh 3.5vw;
        }

        /* --- Header Section --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 10vh;
            margin-bottom: 2vh;
        }

        .brand-area {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .logo-dusuco {
            background: linear-gradient(135deg, #FF6B00 0%, #EA580C 100%);
            color: #FFFFFF;
            font-family: var(--font-display);
            font-weight: 900;
            font-size: clamp(20px, 2.2vw, 36px);
            letter-spacing: 2px;
            padding: 10px 22px;
            border-radius: 14px;
            box-shadow: 0 8px 28px var(--primary-glow);
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .promo-tag-header {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(234, 88, 12, 0.15);
            border: 1px solid rgba(234, 88, 12, 0.4);
            padding: 8px 18px;
            border-radius: 999px;
            color: #FFA07A;
            font-size: clamp(12px, 1.1vw, 17px);
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .live-dot {
            width: 10px;
            height: 10px;
            background-color: #EA580C;
            border-radius: 50%;
            box-shadow: 0 0 12px #EA580C;
            animation: pulse-dot 1.5s infinite;
        }

        @keyframes pulse-dot {
            0% { transform: scale(0.9); opacity: 0.7; }
            50% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 18px #FF5500; }
            100% { transform: scale(0.9); opacity: 0.7; }
        }

        .clock-area {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            font-family: var(--font-display);
        }

        .clock-time {
            font-size: clamp(24px, 2.6vw, 44px);
            font-weight: 800;
            letter-spacing: 1px;
            color: #FFFFFF;
        }

        .clock-date {
            font-size: clamp(12px, 1.1vw, 17px);
            color: var(--text-muted);
            text-transform: capitalize;
            font-weight: 500;
        }

        /* --- Main Hero Content --- */
        .hero-stage {
            flex: 1;
            display: grid;
            grid-template-columns: 1.1fr 1fr;
            gap: 4vw;
            align-items: center;
            min-height: 0;
            position: relative;
        }

        /* Product Image Box */
        .image-showcase {
            height: 100%;
            max-height: 68vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, rgba(30, 41, 59, 0.6) 0%, rgba(15, 23, 42, 0.4) 100%);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 3vw;
            position: relative;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 0 40px rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            overflow: hidden;
        }

        .image-badge-discount {
            position: absolute;
            top: 24px;
            left: 24px;
            background: linear-gradient(135deg, #FF1E00, #EA580C);
            color: #FFFFFF;
            font-family: var(--font-display);
            font-weight: 900;
            font-size: clamp(18px, 2vw, 32px);
            letter-spacing: 0.5px;
            padding: 10px 20px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(234, 88, 12, 0.6);
            display: flex;
            align-items: center;
            gap: 8px;
            animation: bounce-subtle 3s infinite ease-in-out;
            z-index: 2;
        }

        @keyframes bounce-subtle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .product-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 16px;
            filter: drop-shadow(0 15px 35px rgba(0,0,0,0.6));
            transition: opacity 0.6s ease, transform 8s ease-out;
            animation: kenburns 8s infinite alternate;
        }

        @keyframes kenburns {
            0% { transform: scale(1); }
            100% { transform: scale(1.06); }
        }

        .image-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            gap: 16px;
        }

        .image-placeholder svg {
            width: 120px;
            height: 120px;
            opacity: 0.35;
        }

        /* Product Details Info Box */
        .details-showcase {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 2.2vh;
            padding-right: 2vw;
        }

        .meta-badges {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .meta-pill {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: clamp(12px, 1.05vw, 16px);
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        .product-title {
            font-family: var(--font-display);
            font-size: clamp(28px, 3.6vw, 62px);
            font-weight: 900;
            line-height: 1.12;
            color: #FFFFFF;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-shadow: 0 4px 16px rgba(0,0,0,0.5);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* --- Price Presentation Area --- */
        .price-card {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 2.5vh 2.5vw;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
        }

        .price-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #FF6B00, #FBBF24, #10B981);
        }

        .price-row-old {
            display: flex;
            align-items: baseline;
            gap: 12px;
            margin-bottom: 0.5vh;
        }

        .price-label-old {
            font-size: clamp(14px, 1.3vw, 22px);
            font-weight: 700;
            color: #94A3B8;
            letter-spacing: 1px;
        }

        .price-val-old {
            font-family: var(--font-display);
            font-size: clamp(22px, 2.5vw, 42px);
            font-weight: 700;
            color: #EF4444;
            text-decoration: line-through;
            text-decoration-thickness: 3px;
            opacity: 0.85;
        }

        .price-row-promo {
            display: flex;
            align-items: baseline;
            gap: 16px;
            flex-wrap: wrap;
        }

        .price-label-promo {
            font-family: var(--font-display);
            font-size: clamp(20px, 2.2vw, 36px);
            font-weight: 900;
            color: #FFFFFF;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .price-val-promo {
            font-family: var(--font-display);
            font-size: clamp(48px, 6.2vw, 100px);
            font-weight: 900;
            line-height: 1;
            color: var(--accent-gold);
            text-shadow: 0 0 35px var(--accent-gold-glow), 0 4px 10px rgba(0,0,0,0.5);
            letter-spacing: -1px;
        }

        .savings-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #34D399;
            padding: 8px 18px;
            border-radius: 12px;
            font-size: clamp(13px, 1.2vw, 20px);
            font-weight: 800;
            margin-top: 1vh;
            letter-spacing: 0.5px;
        }

        /* --- Footer & Progress Bar --- */
        .footer-bar {
            height: 6vh;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            margin-top: 1vh;
        }

        .progress-track {
            flex: 1;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 999px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #EA580C, #FBBF24);
            box-shadow: 0 0 14px var(--primary-glow);
            border-radius: 999px;
            transition: width 0.1s linear;
        }

        .counter-badge {
            font-family: var(--font-display);
            font-size: clamp(13px, 1.1vw, 18px);
            font-weight: 700;
            color: var(--text-muted);
            white-space: nowrap;
        }

        /* --- Standby / Empty State --- */
        .standby-box {
            grid-column: span 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            height: 60vh;
            gap: 20px;
        }

        .standby-icon {
            width: 90px;
            height: 90px;
            color: #EA580C;
            animation: pulse-dot 2s infinite;
        }

        .standby-title {
            font-family: var(--font-display);
            font-size: clamp(32px, 3.8vw, 60px);
            font-weight: 900;
            color: #FFFFFF;
        }

        .standby-subtitle {
            font-size: clamp(16px, 1.4vw, 24px);
            color: var(--text-muted);
            max-width: 600px;
        }

        /* --- Discreet Floating Controls (Auto-hide on idle) --- */
        .tv-controls {
            position: fixed;
            bottom: 24px;
            right: 32px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid var(--border);
            padding: 8px 14px;
            border-radius: 12px;
            backdrop-filter: blur(12px);
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
            z-index: 99;
        }

        body:hover .tv-controls {
            opacity: 1;
            transform: translateY(0);
        }

        .ctrl-btn {
            background: transparent;
            border: none;
            color: var(--text-main);
            padding: 6px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .ctrl-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--accent-gold);
        }

        .ctrl-select {
            background: rgba(0, 0, 0, 0.5);
            color: #FFFFFF;
            border: 1px solid var(--border);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            outline: none;
        }

        /* Animation class for slide change */
        .slide-in {
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* --- Layout em GRADE --- */
        .hero-stage.modo-grade { display: block; }
        .hero-stage.modo-banner { display: block; }

        .grade {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(var(--cols, 3), 1fr);
            grid-template-rows: repeat(var(--rows, 2), 1fr);
            gap: 1.4vw;
            padding: 0.5vh 0;
        }

        .grade-card {
            min-height: 0;
            display: flex;
            flex-direction: column;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
        }

        .grade-img {
            position: relative;
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, rgba(30, 41, 59, 0.7) 0%, rgba(15, 23, 42, 0.5) 100%);
            padding: 0.8vw;
        }

        .grade-img img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.5));
        }

        .grade-sem-foto { color: var(--text-muted); font-size: clamp(12px, 1.1vw, 18px); }

        .grade-off {
            position: absolute;
            top: 10px;
            left: 10px;
            background: linear-gradient(135deg, #FF1E00, #EA580C);
            color: #fff;
            font-family: var(--font-display);
            font-weight: 900;
            font-size: clamp(14px, 1.5vw, 26px);
            padding: 4px 12px;
            border-radius: 12px;
            box-shadow: 0 6px 16px rgba(234, 88, 12, 0.55);
        }

        .grade-info { padding: 0.9vw 1.1vw 1.1vw; }

        .grade-name {
            font-family: var(--font-display);
            font-weight: 800;
            font-size: clamp(14px, 1.45vw, 26px);
            line-height: 1.15;
            text-transform: uppercase;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 2.3em;
        }

        .grade-prices {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 10px;
            margin-top: 6px;
        }

        .grade-de {
            color: #EF4444;
            text-decoration: line-through;
            font-weight: 700;
            font-size: clamp(12px, 1.15vw, 20px);
        }

        .grade-por {
            color: var(--accent-gold);
            font-family: var(--font-display);
            font-weight: 900;
            font-size: clamp(22px, 2.5vw, 44px);
            text-shadow: 0 0 20px var(--accent-gold-glow);
        }

        /* --- Banner --- */
        .banner-slide {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 28px;
            overflow: hidden;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
        }
        .banner-slide img { width: 100%; height: 100%; object-fit: contain; }

        /* --- Chamada de senha --- */
        .call-overlay {
            position: fixed;
            inset: 0;
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 2vh;
            background: radial-gradient(circle at center, rgba(16, 185, 129, 0.95) 0%, rgba(4, 120, 87, 0.97) 70%);
            text-align: center;
        }
        .call-overlay.show { display: flex; animation: call-in 0.35s ease-out; }
        @keyframes call-in { from { opacity: 0; transform: scale(1.04); } to { opacity: 1; transform: scale(1); } }
        .call-label { font-family: var(--font-display); font-weight: 800; font-size: clamp(24px, 3.2vw, 56px); letter-spacing: 4px; color: #D1FAE5; }
        .call-senha { font-family: var(--font-display); font-weight: 900; font-size: clamp(120px, 24vw, 420px); line-height: 1; color: #fff; text-shadow: 0 10px 40px rgba(0,0,0,0.35); animation: call-pulse 1.2s ease-in-out infinite; }
        .call-sub { font-family: var(--font-display); font-weight: 800; font-size: clamp(28px, 4vw, 72px); color: #fff; letter-spacing: 2px; }
        @keyframes call-pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }

        .voz-btn {
            position: fixed;
            bottom: 24px;
            left: 32px;
            z-index: 120;
            display: none;
            align-items: center;
            gap: 8px;
            background: #F59E0B;
            color: #111827;
            border: none;
            border-radius: 12px;
            padding: 12px 18px;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(245, 158, 11, 0.5);
            animation: call-pulse 1.6s ease-in-out infinite;
        }
        .voz-btn.show { display: flex; }

        .offline-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 300;
            display: none;
            justify-content: center;
            gap: 10px;
            padding: 8px 14px;
            background: #B91C1C;
            color: #fff;
            font-weight: 800;
            font-size: clamp(13px, 1.1vw, 18px);
            letter-spacing: 0.5px;
        }
        .offline-bar.show { display: flex; }
    </style>
</head>
<body>

    <!-- Ambient glow effects -->
    <div class="ambient-glow" id="ambientGlow"></div>
    <div class="ambient-glow-2"></div>

    <div class="tv-container">
        <!-- Top Bar -->
        <header class="header">
            <div class="brand-area">
                <div class="logo-dusuco">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                    DUSUCO
                </div>
                <div class="promo-tag-header">
                    <div class="live-dot"></div>
                    <span>SUPER OFERTAS DA LOJA</span>
                </div>
            </div>

            <div class="clock-area">
                <div class="clock-time" id="clockTime">--:--:--</div>
                <div class="clock-date" id="clockDate">Carregando data...</div>
            </div>
        </header>

        <!-- Main Product Presentation Area -->
        <main class="hero-stage" id="heroStage">
            <!-- Rendered dynamically by JavaScript -->
            <div class="standby-box">
                <svg class="standby-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                <h1 class="standby-title">Carregando Ofertas DUSUCO...</h1>
                <p class="standby-subtitle">Conectando ao catálogo de promoções em tempo real.</p>
            </div>
        </main>

        <!-- Bottom Progress Bar -->
        <footer class="footer-bar">
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="counter-badge" id="counterBadge">OFERTAS DUSUCO</div>
        </footer>
    </div>

    <!-- Discreet Controls for Store Attendant / Screen Setup -->
    <div class="tv-controls">
        <button class="ctrl-btn" id="btnPrev" title="Anterior">
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        </button>
        <button class="ctrl-btn" id="btnPlayPause" title="Pausar / Reproduzir">
            <svg id="iconPause" width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6"/></svg>
            <svg id="iconPlay" style="display:none;" width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/></svg>
        </button>
        <button class="ctrl-btn" id="btnNext" title="Próximo">
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
        </button>
        <select class="ctrl-select" id="selLayout" title="Layout (neste aparelho)">
            <option value="">Layout: automático</option>
            <option value="DESTAQUE">Destaque</option>
            <option value="GRADE">Grade</option>
            <option value="ROTACAO">Rotação + banners</option>
        </select>
        <select class="ctrl-select" id="selDuration" title="Tempo por produto">
            <option value="5000">5s</option>
            <option value="8000" selected>8s</option>
            <option value="12000">12s</option>
            <option value="15000">15s</option>
        </select>
        <button class="ctrl-btn" id="btnFullscreen" title="Tela Cheia (F11)">
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg>
        </button>
    </div>

    <!-- Chamada de senha -->
    <div class="call-overlay" id="callOverlay" aria-live="assertive">
        <div class="call-label">PEDIDO PRONTO • PODE RETIRAR</div>
        <div class="call-senha" id="callSenha">--</div>
        <div class="call-sub">RETIRE NO BALCÃO</div>
    </div>
    <button class="voz-btn" id="btnVoz" title="O navegador exige um toque para liberar a voz">🔊 Toque para ativar a voz</button>
    <div class="offline-bar" id="offlineBar">⚠ Sem conexão com o servidor — tentando reconectar automaticamente…</div>

    <script>
        // A porta da TV (8081) e a 8080 encaminham /api/* ao servidor principal:
        // a propria origem funciona em qualquer porta configurada.
        const API_HOST = window.location.origin;
        const urlParams = new URLSearchParams(window.location.search);

        function esc(v) {
            return String(v === null || v === undefined ? '' : v)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }
        function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
        function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
        const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
        // Um unico AudioContext reaproveitado (criar um por aviso esgota o limite do navegador)
        let _ac = null;
        function audioCtx() {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return null;
            if (!_ac) _ac = new AC();
            if (_ac.state === 'suspended') { try { _ac.resume(); } catch (e) {} }
            return _ac;
        }

        // ------------------------------------------------------------------
        // Estado
        // ------------------------------------------------------------------
        const settings = {          // padroes; sobrescritos por /api/company
            tvLayout: 'DESTAQUE', tvDuracaoSeg: 8, tvGradeItens: 6, tvBannerACada: 3,
            vozAtiva: true, vozRepeticoes: 2, vozTexto: 'Senha {senha}, pode retirar.'
        };
        let produtos = [];
        let banners = [];
        let slides = [];
        let slideIndex = 0;
        let isPaused = false;
        let progressInterval = null;
        let progressStartTime = 0;
        let bannerCursor = 0;

        const durOverride = lsGet('tvDurMs');
        let slideDuration = durOverride ? parseInt(durOverride, 10) : settings.tvDuracaoSeg * 1000;
        let temOverrideDuracao = !!durOverride;

        function layoutEfetivo() {
            const q = (urlParams.get('layout') || '').toUpperCase();
            const local = lsGet('tvLayoutLocal');
            const v = ['DESTAQUE', 'GRADE', 'ROTACAO'].includes(q) ? q : (['DESTAQUE', 'GRADE', 'ROTACAO'].includes(local) ? local : settings.tvLayout);
            return v;
        }

        // ------------------------------------------------------------------
        // Offline
        // ------------------------------------------------------------------
        let offline = false;
        function setOffline(v) {
            if (offline === v) return;
            offline = v;
            document.getElementById('offlineBar').classList.toggle('show', v);
        }
        async function apiGet(path) {
            try {
                const res = await fetch(API_HOST + path);
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const j = await res.json();
                setOffline(false);
                return j;
            } catch (e) {
                setOffline(true);
                throw e;
            }
        }

        // ------------------------------------------------------------------
        // Relogio / formatacao
        // ------------------------------------------------------------------
        function updateClock() {
            const now = new Date();
            const p = (n) => String(n).padStart(2, '0');
            document.getElementById('clockTime').innerText = `${p(now.getHours())}:${p(now.getMinutes())}:${p(now.getSeconds())}`;
            document.getElementById('clockDate').innerText =
                now.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        function formatMoney(val) {
            return Number(val || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }
        function formatPromoDate(dStr) {
            if (!dStr) return '';
            const parts = String(dStr).substring(0, 10).split('-');
            return parts.length === 3 ? `${parts[2]}/${parts[1]}` : dStr;
        }
        const imgUrl = (p, w) => `${API_HOST}/api/products/${p.id}/image?w=${w}&v=${encodeURIComponent(p.ultimaAlteracao || '')}`;

        // ------------------------------------------------------------------
        // Dados
        // ------------------------------------------------------------------
        async function loadSettings() {
            try {
                const j = await apiGet('/api/company');
                if (j && j.success && j.data) {
                    for (const k of Object.keys(settings)) if (j.data[k] !== undefined) settings[k] = j.data[k];
                    if (!temOverrideDuracao) slideDuration = settings.tvDuracaoSeg * 1000;
                    const dur = document.getElementById('selDuration');
                    if (dur && !temOverrideDuracao) {
                        const v = String(slideDuration);
                        if (![...dur.options].some((o) => o.value === v)) dur.add(new Option(`${settings.tvDuracaoSeg}s`, v));
                        dur.value = v;
                    }
                    const sel = document.getElementById('selLayout');
                    if (sel) sel.value = lsGet('tvLayoutLocal') || '';
                }
            } catch (e) { /* mantem os padroes */ }
        }

        async function loadBanners() {
            try {
                const j = await apiGet('/api/tv/banners');
                if (j && j.success) banners = j.data || [];
            } catch (e) { /* ignora */ }
        }

        async function fetchPromotions() {
            try {
                const j = await apiGet('/api/tv/promotions');
                if (j && j.success && Array.isArray(j.data)) {
                    const antes = JSON.stringify(produtos.map((p) => [p.id, p.precoPromocao, p.ultimaAlteracao]));
                    produtos = j.data;
                    const depois = JSON.stringify(produtos.map((p) => [p.id, p.precoPromocao, p.ultimaAlteracao]));
                    if (antes !== depois) reconstruir();
                    else if (!slides.length) reconstruir();
                }
            } catch (err) {
                if (!slides.length) renderStandby('Tentando reconectar ao servidor...');
            }
        }

        // ------------------------------------------------------------------
        // Slides (DESTAQUE / GRADE / ROTACAO)
        // ------------------------------------------------------------------
        function proximoBanner() {
            if (!banners.length) return null;
            const b = banners[bannerCursor % banners.length];
            bannerCursor++;
            return { tipo: 'banner', url: API_HOST + b.url };
        }

        function reconstruir() {
            const L = layoutEfetivo();
            const lista = [];
            bannerCursor = 0;

            if (L === 'GRADE') {
                const n = Math.max(2, settings.tvGradeItens);
                for (let i = 0; i < produtos.length; i += n) lista.push({ tipo: 'grade', itens: produtos.slice(i, i + n) });
            } else {
                produtos.forEach((p, i) => {
                    lista.push({ tipo: 'produto', p });
                    if (L === 'ROTACAO' && banners.length && (i + 1) % Math.max(1, settings.tvBannerACada) === 0) {
                        lista.push(proximoBanner());
                    }
                });
                if (L === 'ROTACAO' && banners.length) {
                    // garante ao menos um banner por volta (poucos produtos) ou so banners (sem promocoes)
                    if (!lista.some((s) => s.tipo === 'banner')) lista.push(proximoBanner());
                }
            }
            slides = lista;
            if (slideIndex >= slides.length) slideIndex = 0;
            if (!slides.length) { renderStandby(); return; }
            renderSlide();
            resetProgress();
        }

        function renderStandby(msg) {
            const stage = document.getElementById('heroStage');
            stage.innerHTML = `
                <div class="standby-box slide-in">
                    <svg class="standby-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                    <h1 class="standby-title">DUSUCO • Em Breve Novas Ofertas!</h1>
                    <p class="standby-subtitle">${esc(msg || 'Todas as nossas promoções exclusivas serão apresentadas aqui em instantes. Fique atento às melhores oportunidades da loja!')}</p>
                </div>`;
            document.getElementById('counterBadge').innerText = 'DUSUCO OFERTAS';
            document.getElementById('progressFill').style.width = '0%';
        }

        function renderSlide() {
            const s = slides[slideIndex];
            if (!s) return;
            const stage = document.getElementById('heroStage');
            stage.classList.toggle('modo-grade', s.tipo === 'grade');
            stage.classList.toggle('modo-banner', s.tipo === 'banner');
            const total = slides.length;
            const badge = document.getElementById('counterBadge');

            if (s.tipo === 'banner') {
                stage.innerHTML = `<div class="banner-slide slide-in"><img src="${esc(s.url)}" alt="Banner" onerror="this.style.display='none'"></div>`;
                badge.innerText = 'DUSUCO • DESTAQUE';
            } else if (s.tipo === 'grade') {
                stage.innerHTML = renderGrade(s.itens);
                badge.innerText = `OFERTAS ${slideIndex + 1} DE ${total}`;
            } else {
                stage.innerHTML = renderProduto(s.p);
                const prodSlides = slides.filter((x) => x.tipo === 'produto');
                badge.innerText = `OFERTA ${prodSlides.indexOf(s) + 1} DE ${prodSlides.length}`;
            }
        }

        function renderProduto(p) {
            const hasPhoto = p.temFoto;
            let promoDateBadge;
            if (p.dtInicioProm && p.dtFimProm) {
                promoDateBadge = `<span class="meta-pill" style="background: rgba(234, 88, 12, 0.18); border-color: rgba(234, 88, 12, 0.5); color: #FFA07A; font-weight: 700;">⏰ VÁLIDO DE ${formatPromoDate(p.dtInicioProm)} ATÉ ${formatPromoDate(p.dtFimProm)}</span>`;
            } else if (p.dtFimProm) {
                promoDateBadge = `<span class="meta-pill" style="background: rgba(234, 88, 12, 0.18); border-color: rgba(234, 88, 12, 0.5); color: #FFA07A; font-weight: 700;">⏰ VÁLIDO ATÉ ${formatPromoDate(p.dtFimProm)}</span>`;
            } else {
                promoDateBadge = `<span class="meta-pill" style="background: rgba(16, 185, 129, 0.18); border-color: rgba(16, 185, 129, 0.5); color: #34D399; font-weight: 700;">✨ OFERTA POR TEMPO LIMITADO</span>`;
            }
            const foto = hasPhoto
                ? `<img src="${imgUrl(p, 1200)}" alt="${esc(p.descricao)}" class="product-img" onerror="this.onerror=null; this.replaceWith(Object.assign(document.createElement('div'), {className:'image-placeholder', textContent:'Foto do Produto'}))"/>`
                : `<div class="image-placeholder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg><span style="font-size: 1.2vw; font-weight: 600;">DUSUCO • Sem Imagem</span></div>`;
            return `
                <div class="image-showcase slide-in">
                    <div class="image-badge-discount"><span>-${esc(p.descontoPercentual)}% OFF</span></div>
                    ${foto}
                </div>
                <div class="details-showcase slide-in">
                    <div class="meta-badges">
                        <span class="meta-pill">CÓD: ${esc(p.codigo || p.id)}</span>
                        ${p.referencia ? `<span class="meta-pill">REF: ${esc(p.referencia)}</span>` : ''}
                        <span class="meta-pill">UN: ${esc(p.unidade)}</span>
                        ${promoDateBadge}
                    </div>
                    <h1 class="product-title" title="${esc(p.descricao)}">${esc(p.descricao)}</h1>
                    <div class="price-card">
                        <div class="price-row-old"><span class="price-label-old">DE:</span><span class="price-val-old">${formatMoney(p.precoVenda)}</span></div>
                        <div class="price-row-promo"><span class="price-label-promo">POR:</span><span class="price-val-promo">${formatMoney(p.precoPromocao)}</span></div>
                        ${p.economiaReais > 0 ? `<div><div class="savings-badge">VOCÊ ECONOMIZA: ${formatMoney(p.economiaReais)}</div></div>` : ''}
                    </div>
                </div>`;
        }

        function renderGrade(itens) {
            const n = itens.length;
            const cols = n <= 2 ? n : (n <= 4 ? 2 : (n <= 6 ? 3 : (n <= 9 ? 3 : 4)));
            const rows = Math.ceil(n / cols);
            const cards = itens.map((p) => `
                <div class="grade-card slide-in">
                    <div class="grade-img">
                        ${p.temFoto ? `<img src="${imgUrl(p, 400)}" alt="" onerror="this.style.display='none'">` : '<span class="grade-sem-foto">Sem foto</span>'}
                        <span class="grade-off">-${esc(p.descontoPercentual)}%</span>
                    </div>
                    <div class="grade-info">
                        <div class="grade-name">${esc(p.descricao)}</div>
                        <div class="grade-prices">
                            <span class="grade-de">${formatMoney(p.precoVenda)}</span>
                            <span class="grade-por">${formatMoney(p.precoPromocao)}</span>
                        </div>
                    </div>
                </div>`).join('');
            return `<div class="grade" style="--cols:${cols}; --rows:${rows};">${cards}</div>`;
        }

        // ------------------------------------------------------------------
        // Navegacao / progresso
        // ------------------------------------------------------------------
        function nextSlide() {
            if (slides.length <= 1) return;
            slideIndex = (slideIndex + 1) % slides.length;
            renderSlide();
            resetProgress();
        }
        function prevSlide() {
            if (slides.length <= 1) return;
            slideIndex = (slideIndex - 1 + slides.length) % slides.length;
            renderSlide();
            resetProgress();
        }
        function startProgress() {
            if (isPaused) return;
            clearInterval(progressInterval);
            progressStartTime = Date.now();
            const fill = document.getElementById('progressFill');
            progressInterval = setInterval(() => {
                if (isPaused) return;
                const elapsed = Date.now() - progressStartTime;
                fill.style.width = `${Math.min(100, (elapsed / slideDuration) * 100)}%`;
                if (elapsed >= slideDuration) {
                    clearInterval(progressInterval);
                    if (slides.length > 1) nextSlide(); else resetProgress();
                }
            }, 60);
        }
        function resetProgress() {
            document.getElementById('progressFill').style.width = '0%';
            startProgress();
        }
        function togglePlayPause() {
            isPaused = !isPaused;
            document.getElementById('iconPause').style.display = isPaused ? 'none' : 'block';
            document.getElementById('iconPlay').style.display = isPaused ? 'block' : 'none';
            if (!isPaused) startProgress();
        }
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch((e) => console.warn('fullscreen:', e));
            } else if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }

        // ------------------------------------------------------------------
        // Chamada de senha (voz + painel na tela)
        // ------------------------------------------------------------------
        const announced = new Set();
        try { JSON.parse(sessionStorage.getItem('tvAnnounced') || '[]').forEach((k) => announced.add(k)); } catch (e) {}
        function salvarAnunciados() {
            try { sessionStorage.setItem('tvAnnounced', JSON.stringify([...announced].slice(-300))); } catch (e) {}
        }
        let primeiraVarredura = true;
        const filaChamadas = [];
        let chamando = false;

        function userActivated() {
            return !!(navigator.userActivation && navigator.userActivation.hasBeenActive);
        }
        function atualizarBotaoVoz() {
            const b = document.getElementById('btnVoz');
            const precisa = settings.vozAtiva && !userActivated();
            b.classList.toggle('show', precisa);
        }

        let vozPt = null;
        function escolherVoz() {
            if (!window.speechSynthesis) return;
            const vs = speechSynthesis.getVoices();
            vozPt = vs.find((v) => v.lang && v.lang.toLowerCase() === 'pt-br') || vs.find((v) => v.lang && v.lang.toLowerCase().startsWith('pt')) || null;
        }
        if (window.speechSynthesis) {
            escolherVoz();
            speechSynthesis.addEventListener('voiceschanged', escolherVoz);
        }

        function falar(texto) {
            return new Promise((resolve) => {
                if (!window.speechSynthesis) return resolve();
                try {
                    const u = new SpeechSynthesisUtterance(texto);
                    u.lang = 'pt-BR';
                    if (vozPt) u.voice = vozPt;
                    u.rate = 0.9;
                    u.pitch = 1;
                    u.volume = 1;
                    let feito = false;
                    const fim = () => { if (!feito) { feito = true; resolve(); } };
                    u.onend = fim;
                    u.onerror = fim;
                    setTimeout(fim, 9000); // seguranca: nunca trava a fila
                    speechSynthesis.speak(u);
                } catch (e) { resolve(); }
            });
        }

        function campainha() {
            try {
                const ctx = audioCtx();
                if (!ctx) return;
                [[880, 0], [1174.66, 0.2]].forEach(([freq, t]) => {
                    const o = ctx.createOscillator();
                    const g = ctx.createGain();
                    o.type = 'sine';
                    o.frequency.setValueAtTime(freq, ctx.currentTime + t);
                    g.gain.setValueAtTime(0.3, ctx.currentTime + t);
                    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.9);
                    o.connect(g); g.connect(ctx.destination);
                    o.start(ctx.currentTime + t);
                    o.stop(ctx.currentTime + t + 0.9);
                });
            } catch (e) { /* sem audio */ }
        }

        function textoFalado(o) {
            const senha = String(o.senha || '').trim();
            const numero = /^\d+$/.test(senha) ? String(Number(senha)) : senha.split('').join(' ');
            const modelo = String(settings.vozTexto || 'Senha {senha}, pode retirar.');
            return modelo.includes('{senha}') ? modelo.replace('{senha}', numero) : `Senha ${numero}, ${modelo}`;
        }

        async function executarChamada(o) {
            const ov = document.getElementById('callOverlay');
            document.getElementById('callSenha').innerText = o.senha;
            ov.classList.add('show');
            campainha();
            await sleep(700);
            const reps = Math.max(1, Math.min(3, settings.vozRepeticoes || 1));
            const inicio = Date.now();
            for (let i = 0; i < reps; i++) {
                await falar(textoFalado(o));
                if (i < reps - 1) await sleep(700);
            }
            // mantem a senha visivel por pelo menos 7 segundos mesmo sem audio
            const restante = 7000 - (Date.now() - inicio);
            if (restante > 0) await sleep(restante);
            ov.classList.remove('show');
            await sleep(400);
        }

        async function processarFila() {
            if (chamando) return;
            chamando = true;
            try {
                while (filaChamadas.length) await executarChamada(filaChamadas.shift());
            } finally { chamando = false; }
        }

        async function verificarChamadas() {
            if (!settings.vozAtiva) return;
            let lista;
            try {
                const j = await apiGet('/api/tv/calls');
                lista = j && j.success ? j.data : null;
            } catch (e) { return; }
            if (!Array.isArray(lista)) return;

            const agora = Date.now();
            const novos = [];
            for (const o of lista) {
                if (o.estado !== 'PRONTO') continue;
                const chave = `${o.id}|${o.dtPronto}`;
                if (announced.has(chave)) continue;
                announced.add(chave);
                if (primeiraVarredura) continue; // nao anuncia o que ja estava pronto ao abrir a TV
                const t = Date.parse(String(o.dtPronto).replace(' ', 'T'));
                if (isFinite(t) && agora - t > 15 * 60000) continue; // pronto ha muito tempo
                novos.push({ ...o, _t: isFinite(t) ? t : agora });
            }
            primeiraVarredura = false;
            salvarAnunciados();
            novos.sort((a, b) => a._t - b._t).forEach((o) => filaChamadas.push(o));
            if (filaChamadas.length) processarFila();
        }

        document.getElementById('btnVoz').addEventListener('click', () => {
            // o clique conta como ativacao do usuario: libera audio e voz
            falar('Voz ativada.');
            campainha();
            setTimeout(atualizarBotaoVoz, 200);
        });
        document.addEventListener('pointerdown', () => setTimeout(atualizarBotaoVoz, 100), { passive: true });
        document.addEventListener('keydown', () => setTimeout(atualizarBotaoVoz, 100));

        // ------------------------------------------------------------------
        // Controles
        // ------------------------------------------------------------------
        document.getElementById('btnNext').addEventListener('click', nextSlide);
        document.getElementById('btnPrev').addEventListener('click', prevSlide);
        document.getElementById('btnPlayPause').addEventListener('click', togglePlayPause);
        document.getElementById('btnFullscreen').addEventListener('click', toggleFullscreen);

        document.getElementById('selDuration').addEventListener('change', (e) => {
            slideDuration = parseInt(e.target.value, 10) || 8000;
            temOverrideDuracao = true;
            lsSet('tvDurMs', String(slideDuration));
            resetProgress();
        });
        document.getElementById('selLayout').addEventListener('change', (e) => {
            if (e.target.value) lsSet('tvLayoutLocal', e.target.value);
            else { try { localStorage.removeItem('tvLayoutLocal'); } catch (err) {} }
            slideIndex = 0;
            reconstruir();
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
            else if (e.key === 'ArrowLeft') prevSlide();
            else if (e.key === 'f' || e.key === 'F') toggleFullscreen();
        });

        // ------------------------------------------------------------------
        // Inicializacao e tempo real
        // ------------------------------------------------------------------
        async function carregarTudo() {
            await Promise.all([loadSettings(), loadBanners()]);
            await fetchPromotions();
            reconstruir();
            atualizarBotaoVoz();
        }

        let recarga = null;
        function agendarRecarga() {
            if (recarga) return;
            recarga = setTimeout(async () => { recarga = null; await carregarTudo(); }, 500);
        }
        let chamadasTimer = null;
        function agendarChamadas() {
            if (chamadasTimer) return;
            chamadasTimer = setTimeout(() => { chamadasTimer = null; verificarChamadas(); }, 250);
        }

        if (window.EventSource) {
            const es = new EventSource(`${API_HOST}/api/events`);
            es.addEventListener('products', agendarRecarga);   // promocoes, banners e configuracoes
            es.addEventListener('orders', agendarChamadas);    // pedido pronto -> chamada de senha
            es.addEventListener('hello', () => { setOffline(false); agendarChamadas(); });
            es.onerror = () => setOffline(true);
        }

        // Redes de seguranca (conexao de eventos caida / virada de dia)
        setInterval(fetchPromotions, 5 * 60000);
        setInterval(verificarChamadas, 10000);
        setInterval(() => { if (offline) carregarTudo(); }, 5000);

        carregarTudo().then(() => verificarChamadas());
    </script>
</body>
</html>
