<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDS — Cozinha</title>
    <style>
        :root {
            --bg: #0B1120; --panel: #111A2E; --card: #1A2540; --border: #2B3A5C; --text: #F1F5F9; --muted: #94A3B8;
            --ok: #22C55E; --warn: #F59E0B; --late: #EF4444; --accent: #38BDF8;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { display: flex; flex-direction: column; }
        .offline { display: none; background: #B91C1C; text-align: center; padding: 7px; font-weight: 800; font-size: 14px; }
        .offline.show { display: block; }
        header { display: flex; align-items: center; gap: 14px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
        header h1 { font-size: 18px; margin: 0; }
        .abas { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
        .aba { background: var(--card); border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: 8px 14px; font-weight: 800; font-size: 14px; cursor: pointer; }
        .aba.ativa { background: var(--accent); color: #04263A; border-color: var(--accent); }
        .aba .n { margin-left: 6px; background: rgba(0,0,0,.25); border-radius: 99px; padding: 1px 8px; font-size: 12px; }
        .ferr { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 13px; }
        .ferr button { background: var(--card); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
        #relogio { font-weight: 800; font-size: 18px; color: var(--text); }

        .corpo { flex: 1; display: grid; grid-template-columns: 300px 1fr; min-height: 0; }
        aside { background: var(--panel); border-right: 1px solid var(--border); overflow-y: auto; padding: 12px; }
        aside h2 { font-size: 13px; letter-spacing: 1.5px; color: var(--muted); margin: 0 0 10px; }
        .grupo { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
        .grupo .q { font-size: 26px; font-weight: 900; color: var(--accent); min-width: 44px; text-align: center; }
        .grupo .d { font-weight: 700; font-size: 14px; line-height: 1.2; }
        .grupo .s { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
        .grupo.atraso { border-color: var(--late); }
        main { overflow-y: auto; padding: 14px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; align-content: start; }
        .vazio { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 80px 10px; font-size: 18px; }

        .ticket { background: var(--card); border: 2px solid var(--border); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; }
        .ticket.verde { border-color: var(--ok); }
        .ticket.amarelo { border-color: var(--warn); }
        .barra { height: 6px; background: rgba(255,255,255,.08); }
        .barra i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .9s linear, background .3s; }
        .ticket.amarelo .barra i { background: var(--warn); }
        .ticket.vermelho .barra i { background: var(--late); }
        .cab .tempo { font-variant-numeric: tabular-nums; }
        .ticket.vermelho { border-color: var(--late); animation: pulso 1.4s ease-in-out infinite; }
        .ticket.novo { animation: entrada .6s ease-out; }
        @keyframes pulso { 0%,100% { box-shadow: 0 0 0 0 rgba(239,68,68,.45); } 50% { box-shadow: 0 0 0 8px rgba(239,68,68,0); } }
        @keyframes entrada { from { transform: scale(.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .cab { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: rgba(255,255,255,.04); }
        .cab .senha { font-size: 38px; font-weight: 900; line-height: 1; }
        .cab .meta { text-align: right; font-size: 12.5px; color: var(--muted); }
        .cab .tempo { font-size: 20px; font-weight: 900; color: var(--ok); }
        .ticket.amarelo .tempo { color: var(--warn); }
        .ticket.vermelho .tempo { color: var(--late); }
        ul { list-style: none; margin: 0; padding: 8px 14px; flex: 1; }
        li { display: flex; align-items: baseline; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--border); font-size: 16px; }
        li:last-child { border-bottom: 0; }
        li .qtd { font-weight: 900; color: var(--accent); min-width: 38px; }
        li .desc { flex: 1; font-weight: 700; line-height: 1.2; }
        li .obs { display: block; font-size: 12.5px; color: var(--warn); font-weight: 600; margin-top: 2px; }
        li .est { font-size: 11px; color: var(--muted); border: 1px solid var(--border); border-radius: 6px; padding: 1px 6px; }
        li .min { font-size: 12px; color: var(--muted); white-space: nowrap; }
        li .min.atraso { color: var(--late); font-weight: 800; }
        .rodape { padding: 10px 14px 14px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .rodape button { flex: 1; min-width: 120px; background: var(--ok); color: #052E16; border: 0; border-radius: 12px; padding: 13px; font-size: 16px; font-weight: 900; cursor: pointer; }
        .rodape button:disabled { opacity: .55; cursor: wait; }
        .chip { font-size: 12px; font-weight: 800; padding: 4px 9px; border-radius: 99px; background: rgba(34,197,94,.18); color: var(--ok); }
        .chip.falta { background: rgba(245,158,11,.18); color: var(--warn); }

        @media (max-width: 800px) { .corpo { grid-template-columns: 1fr; } aside { border-right: 0; border-bottom: 1px solid var(--border); max-height: 28vh; } }
    </style>
</head>
<body>
    <div class="offline" id="offline">⚠ Sem conexão com o servidor — tentando reconectar…</div>
    <header>
        <h1>👨‍🍳 KDS</h1>
        <div class="abas" id="abas"></div>
        <div class="ferr">
            <button id="btnSom" title="Aviso sonoro de novo pedido">🔔</button>
            <span id="relogio">--:--</span>
        </div>
    </header>
    <div class="corpo">
        <aside>
            <h2>PREPARAR AGORA</h2>
            <div id="agrupado"></div>
        </aside>
        <main id="tickets"></main>
    </div>

    <script>
        const $ = (id) => document.getElementById(id);
        const esc = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        const lsGet = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
        const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

        // token opcional (servidor com API_TOKEN): abrir uma vez com ?token=...
        let TOKEN = '';
        try {
            const q = new URLSearchParams(location.search).get('token');
            if (q) localStorage.setItem('apiToken', q);
            TOKEN = localStorage.getItem('apiToken') || '';
        } catch (e) {}
        // Sessao expirada / acesso sem login: leva para a tela de login e volta para ca
        let _indoLogin = false;
        function irParaLogin() {
            if (_indoLogin) return;
            _indoLogin = true;
            location.href = '/login?next=' + encodeURIComponent(location.pathname + location.search);
        }
        const api = (p, o = {}) => fetch(p, { ...o, headers: { ...(o.headers || {}), ...(TOKEN ? { 'x-api-token': TOKEN } : {}) } })
            .then((r) => { if (r.status === 401) irParaLogin(); return r; });

        const qs = new URLSearchParams(location.search);
        let estacao = qs.get('estacao') || lsGet('kdsEstacao') || '';
        let estacoes = [];
        let dados = null;
        let limiteMin = 10;
        let somAtivo = lsGet('kdsSom') !== '0';
        const vistos = new Set();
        let primeira = true;
        let ocupado = false;

        // ---- relogio ----
        setInterval(() => {
            const d = new Date();
            $('relogio').textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
        }, 1000);

        // ---- som ----
        // Um unico AudioContext reaproveitado (criar um por aviso esgota o limite do navegador)
        let _ac = null;
        function audioCtx() {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return null;
            if (!_ac) _ac = new AC();
            if (_ac.state === 'suspended') { try { _ac.resume(); } catch (e) {} }
            return _ac;
        }
        function beep() {
            if (!somAtivo) return;
            try {
                const ctx = audioCtx();
                if (!ctx) return;
                [0, 0.18].forEach((t) => {
                    const o = ctx.createOscillator(); const g = ctx.createGain();
                    o.type = 'triangle'; o.frequency.value = 740;
                    g.gain.setValueAtTime(0.25, ctx.currentTime + t);
                    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.25);
                    o.connect(g); g.connect(ctx.destination);
                    o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.25);
                });
            } catch (e) {}
        }
        function pintarSom() { $('btnSom').textContent = somAtivo ? '🔔' : '🔕'; }
        $('btnSom').addEventListener('click', () => { somAtivo = !somAtivo; lsSet('kdsSom', somAtivo ? '1' : '0'); pintarSom(); beep(); });
        pintarSom();

        function offline(v) { $('offline').classList.toggle('show', v); }

        // ---- dados ----
        async function carregar() {
            if (ocupado) return;
            ocupado = true;
            try {
                const url = '/api/kds/orders' + (estacao ? '?estacao=' + encodeURIComponent(estacao) : '');
                const r = await api(url);
                const j = await r.json();
                if (!j.success) throw new Error(j.error || 'erro');
                dados = j.data;
                estacoes = dados.estacoes;
                offline(false);

                // novos pedidos (nao toca na primeira carga)
                let novo = false;
                dados.pedidos.forEach((p) => { if (!vistos.has(p.id)) { vistos.add(p.id); if (!primeira) novo = true; p._novo = !primeira; } });
                primeira = false;
                if (novo) beep();
                desenhar();
            } catch (e) {
                offline(true);
            } finally {
                ocupado = false;
            }
        }

        // verde ate 50% do limite, amarelo ate o limite, vermelho depois (limite = alertaPreparoMin)
        function classeTempo(min) {
            if (min >= limiteMin) return 'vermelho';
            if (min >= Math.max(1, Math.round(limiteMin * 0.5))) return 'amarelo';
            return 'verde';
        }
        const mmss = (s) => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
        // relogio ao vivo: atualiza tempo, cor e barra de cada pedido a cada segundo, sem redesenhar
        function tickRelogio() {
            const agora = Date.now();
            document.querySelectorAll('#tickets .ticket[data-t0]').forEach((el) => {
                const seg = Math.max(0, Math.floor((agora - parseInt(el.dataset.t0, 10)) / 1000));
                const min = Math.floor(seg / 60);
                const c = classeTempo(min);
                ['verde', 'amarelo', 'vermelho'].forEach((k) => el.classList.toggle(k, k === c));
                const t = el.querySelector('.tempo');
                if (t) t.textContent = mmss(seg);
                const b = el.querySelector('.barra i');
                if (b) b.style.width = Math.min(100, Math.round((seg / (limiteMin * 60)) * 100)) + '%';
            });
        }
        setInterval(tickRelogio, 1000);
        const nomeEstacao = (id) => (estacoes.find((e) => e.id === id) || { nome: id }).nome;

        function desenharAbas() {
            const total = dados ? dados.pedidos.length : 0;
            const abas = [{ id: '', nome: 'Todas' }, ...estacoes];
            $('abas').innerHTML = abas.map((a) =>
                `<button class="aba ${a.id === estacao ? 'ativa' : ''}" data-id="${esc(a.id)}">${esc(a.nome)}${a.id === estacao ? `<span class="n">${total}</span>` : ''}</button>`).join('');
            $('abas').querySelectorAll('.aba').forEach((b) => b.addEventListener('click', () => {
                estacao = b.dataset.id;
                lsSet('kdsEstacao', estacao);
                vistos.clear(); primeira = true;
                carregar();
            }));
        }

        function desenhar() {
            if (!dados) return;
            desenharAbas();

            // agrupado
            $('agrupado').innerHTML = dados.agrupado.length
                ? dados.agrupado.map((g) => `<div class="grupo ${g.maisAntigoMin >= limiteMin ? 'atraso' : ''}">
                        <div class="q">${esc(g.quantidade)}×</div>
                        <div><div class="d">${esc(g.descricao)}</div><div class="s">Senhas ${g.pedidos.map(esc).join(', ')} • mais antigo ${g.maisAntigoMin} min</div></div>
                    </div>`).join('')
                : '<div class="vazio" style="padding:30px 0;font-size:14px">Nada para preparar</div>';

            // tickets
            if (dados.pedidos.length === 0) {
                $('tickets').innerHTML = '<div class="vazio">✅ Nenhum pedido pendente' + (estacao ? ' nesta estação' : '') + '</div>';
                return;
            }
            // urgencia: o item mais antigo manda (um pedido com item parado sobe na frente)
            const urgencia = (p) => Math.max(p.segundos || 0, ...p.itens.map((i) => i.segundos || 0));
            const ordenados = [...dados.pedidos].sort((a, b) => urgencia(b) - urgencia(a));
            $('tickets').innerHTML = ordenados.map((p) => {
                const t0 = Date.now() - urgencia(p) * 1000;
                const classe = classeTempo(Math.floor(urgencia(p) / 60));
                const meta = [p.comanda ? 'Cmd ' + p.comanda : '', p.mesa ? 'Mesa ' + p.mesa : '', p.cliente || ''].filter(Boolean).map(esc).join(' • ');
                const itens = p.itens.map((i) => `<li>
                        <span class="qtd">${esc(i.quantidade)}×</span>
                        <span class="desc">${esc(i.descricao)}${i.observacao ? `<span class="obs">⚠ ${esc(i.observacao)}</span>` : ''}</span>
                        ${estacao ? '' : `<span class="est">${esc(nomeEstacao(i.estacao))}</span>`}
                        <span class="min ${i.minutos >= limiteMin ? 'atraso' : ''}">${i.minutos} min</span>
                    </li>`).join('');
                const chips = p.estacoesEnvolvidas.length > 1
                    ? p.estacoesEnvolvidas.map((e) => `<span class="chip ${p.estacoesConcluidas.includes(e) ? '' : 'falta'}">${p.estacoesConcluidas.includes(e) ? '✓' : '…'} ${esc(nomeEstacao(e))}</span>`).join('')
                    : '';
                const botoes = estacao
                    ? `<button data-id="${p.id}" data-est="${esc(estacao)}">✔ Concluir ${esc(nomeEstacao(estacao))}</button>`
                    : p.estacoesEnvolvidas.filter((e) => !p.estacoesConcluidas.includes(e))
                        .map((e) => `<button data-id="${p.id}" data-est="${esc(e)}">✔ ${esc(nomeEstacao(e))}</button>`).join('');
                return `<article class="ticket ${classe} ${p._novo ? 'novo' : ''}" data-t0="${t0}">
                    <div class="cab"><div class="senha">${esc(p.senha)}</div>
                        <div class="meta"><div class="tempo">${mmss(urgencia(p))}</div>${meta}</div></div>
                    <div class="barra"><i style="width:${Math.min(100, Math.round((urgencia(p) / (limiteMin * 60)) * 100))}%"></i></div>
                    <ul>${itens}</ul>
                    <div class="rodape">${chips}${botoes}</div>
                </article>`;
            }).join('');

            $('tickets').querySelectorAll('.rodape button').forEach((b) => b.addEventListener('click', () => concluir(b)));
            tickRelogio();
            dados.pedidos.forEach((p) => { p._novo = false; });
        }

        async function concluir(btn) {
            btn.disabled = true;
            try {
                const r = await api(`/api/kds/orders/${btn.dataset.id}/done`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ estacao: btn.dataset.est })
                });
                const j = await r.json();
                if (!j.success) throw new Error(j.error || 'Falha ao concluir');
                carregar();
            } catch (e) {
                btn.disabled = false;
                alert('Não foi possível concluir: ' + e.message);
            }
        }

        // ---- limite de alerta (mesmo do painel de pedidos) ----
        fetch('/api/company').then((r) => r.json()).then((j) => {
            if (j.data && j.data.alertaPreparoMin) limiteMin = j.data.alertaPreparoMin;
        }).catch(() => {});

        // ---- tempo real ----
        if (window.EventSource) {
            const es = new EventSource('/api/events');
            let t = null;
            es.addEventListener('orders', () => { clearTimeout(t); t = setTimeout(carregar, 250); });
            es.addEventListener('hello', () => { offline(false); carregar(); });
            es.onerror = () => offline(true);
        }
        setInterval(carregar, 15000);                       // rede de seguranca
        setInterval(() => { if (dados) desenhar(); }, 30000); // os minutos "andam"
        carregar();
    </script>

    <!-- Tela cheia + tela sempre acesa (F ou botao) -->
    <style>
        #btnTelaCheia { position: fixed; right: 12px; bottom: 12px; z-index: 50; width: 44px; height: 44px; border-radius: 12px;
            border: 1px solid rgba(148,163,184,.45); background: rgba(15,23,42,.72); color: #f1f5f9; font-size: 20px; cursor: pointer;
            opacity: .55; transition: opacity .2s; backdrop-filter: blur(4px); }
        #btnTelaCheia:hover { opacity: 1; }
        :fullscreen #btnTelaCheia { opacity: .25; }
    </style>
    <button id="btnTelaCheia" title="Tela cheia (F)" aria-label="Tela cheia">⛶</button>
    <script>
    (function () {
        var wl = null;
        function manterAcesa() {
            try { if (navigator.wakeLock) navigator.wakeLock.request('screen').then(function (l) { wl = l; }).catch(function () {}); } catch (e) {}
        }
        function alternar() {
            var d = document;
            if (d.fullscreenElement) { d.exitFullscreen(); return; }
            var el = d.documentElement;
            (el.requestFullscreen || el.webkitRequestFullscreen || function () {}).call(el);
            manterAcesa();
        }
        document.getElementById('btnTelaCheia').addEventListener('click', alternar);
        document.addEventListener('keydown', function (e) {
            if ((e.key === 'f' || e.key === 'F') && !/INPUT|TEXTAREA|SELECT/.test((e.target && e.target.tagName) || '')) alternar();
        });
        document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && wl) manterAcesa(); });
        manterAcesa();
    })();
    </script>

    <!-- Acabamento: favicon, foco visivel, movimento reduzido, contador no titulo e tamanho do texto -->
    <style>
        :focus-visible { outline: 3px solid #38BDF8; outline-offset: 2px; border-radius: 6px; }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; } }
        #zoomTexto { position: fixed; right: 12px; bottom: 64px; z-index: 50; display: flex; gap: 6px; opacity: .55; transition: opacity .2s; }
        #zoomTexto:hover, #zoomTexto:focus-within { opacity: 1; }
        #zoomTexto button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid rgba(148,163,184,.45); background: rgba(15,23,42,.72); color: #f1f5f9; font-size: 15px; font-weight: 800; cursor: pointer; backdrop-filter: blur(4px); }
    </style>
    <div id="zoomTexto" role="group" aria-label="Tamanho do texto"><button type="button" id="zoomMenos" aria-label="Diminuir texto" title="Diminuir texto">A−</button><button type="button" id="zoomMais" aria-label="Aumentar texto" title="Aumentar texto">A+</button></div>
    <script>
    (function () {
        try {
            if (!document.querySelector('link[rel~="icon"]')) {
                var l = document.createElement('link'); l.rel = 'icon'; l.href = 'data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%20100%20100%27%3E%3Ctext%20y%3D%27.9em%27%20font-size%3D%2790%27%3E%F0%9F%91%A8%E2%80%8D%F0%9F%8D%B3%3C%2Ftext%3E%3C%2Fsvg%3E';
                document.head.appendChild(l);
            }
        } catch (e) {}
        var chave = 'tamanhoTexto:' + location.pathname;
        var z = 1;
        try { z = parseFloat(localStorage.getItem(chave)) || 1; } catch (e) {}
        function aplicar() { document.documentElement.style.zoom = String(z); try { localStorage.setItem(chave, String(z)); } catch (e) {} }
        aplicar();
        document.getElementById('zoomMais').addEventListener('click', function () { z = Math.min(1.6, Math.round((z + 0.1) * 10) / 10); aplicar(); });
        document.getElementById('zoomMenos').addEventListener('click', function () { z = Math.max(0.7, Math.round((z - 0.1) * 10) / 10); aplicar(); });
        var base = document.title, espera = null;
        function contar() {
            espera = null;
            var n = document.querySelectorAll('#tickets .ticket').length;
            document.title = (n > 0 ? '(' + n + ') ' : '') + base;
        }
        new MutationObserver(function () { if (!espera) espera = setTimeout(contar, 400); })
            .observe(document.body, { childList: true, subtree: true });
        setTimeout(contar, 1500);
    })();
    </script>
</body>
</html>
